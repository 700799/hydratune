[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hydratune"
version = "0.1.0"
description = "YAML-configurable LLM fine-tuning harness built on TRL, PEFT, and Accelerate."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "HydraTune contributors" }]
keywords = ["llm", "fine-tuning", "lora", "qlora", "trl", "peft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies are deliberately light: config validation and the CLI must
# work on machines without CUDA (e.g. validating a config on a laptop before
# shipping it to a GPU box). Heavy training dependencies live in the extras.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=4.41",
    "trl>=0.9",
    "peft>=0.11",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "datasets>=2.19",
    "sentencepiece>=0.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
hydratune = "hydratune.cli:app"

[project.urls]
Homepage = "https://github.com/700799/hydratune"

[tool.hatch.build.targets.wheel]
packages = ["hydratune"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
